<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'Inter', sans-serif; background: #fff; color: rgba(0,0,0,.9); -webkit-font-smoothing: antialiased; }

:root {
  /* Brand — Red → Pink */
  --brand-red:    #C8102E;
  --brand-rose:   #E8395A;
  --brand-pink:   #F06080;
  --brand-blush:  #FDE8EC;

  /* Notion neutrals */
  --white:        #ffffff;
  --warm-white:   #f6f5f4;
  --warm-dark:    #1e1614;
  --gray-700:     #2e2928;
  --gray-500:     #615d59;
  --gray-300:     #a39e98;
  --gray-100:     #f0eeec;

  --border:       rgba(0,0,0,0.09);
  --shadow-card:
    rgba(0,0,0,0.04) 0px 4px 18px,
    rgba(0,0,0,0.027) 0px 2px 8px,
    rgba(0,0,0,0.015) 0px 1px 3px;
  --shadow-deep:
    rgba(200,16,46,0.07) 0px 8px 32px,
    rgba(0,0,0,0.05) 0px 2px 8px;

  --r-micro: 4px;
  --r-card: 12px;
  --r-large: 16px;
}

/* ── NAV ── */
.nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,.88); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 48px; height: 56px;
}
.nav-logo { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--gray-700); }
.nav-logo span { color: var(--brand-red); }
.nav-links { display: flex; gap: 28px; }
.nav-link {
  font-size: 13px; font-weight: 500; color: var(--gray-500);
  text-decoration: none; cursor: pointer; transition: color .15s;
}
.nav-link:hover { color: var(--brand-red); }
.nav-cta {
  display: inline-block; padding: 8px 18px;
  background: var(--brand-red); color: #fff;
  font-size: 13px; font-weight: 600; border-radius: var(--r-micro);
  text-decoration: none; cursor: pointer; transition: background .15s;
}
.nav-cta:hover { background: var(--brand-rose); }

/* ── HERO ── */
.hero {
  background: var(--warm-dark);
  padding: 96px 80px 80px;
  position: relative; overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 70% 90% at 80% 50%, rgba(200,16,46,.35) 0%, transparent 70%);
  pointer-events: none;
}
.hero-inner { max-width: 1080px; margin: 0 auto; position: relative; }
.hero-tag {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: rgba(255,255,255,.5); border: 1px solid rgba(255,255,255,.12);
  border-radius: var(--r-micro); padding: 5px 12px; margin-bottom: 28px;
}
.hero-tag-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand-pink); }
.hero h1 {

  color: #fff; line-height: 1.0; letter-spacing: -3px;
  max-width: 700px; margin-bottom: 32px;

}
.hero h1 em { font-style: normal; color: var(--brand-pink); }
.hero-meta {
  display: flex; gap: 0; margin-top: 52px;
  border-top: 1px solid rgba(255,255,255,.1); padding-top: 32px;
}
.hero-meta-item {
  padding-right: 48px; margin-right: 48px;

}
.hero-meta-item:last-child { border-right: none; }
.hero-meta-label { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.35); margin-bottom: 6px; }
.hero-meta-val { font-size: 17px; font-weight: 600; color: #fff; }
.hero-meta-sub { font-size: 12px; color: rgba(255,255,255,.4); margin-top: 2px; }

/* ── SECTIONS ── */
.section { padding: 72px 80px; }
.section-alt { background: var(--warm-white); }
.section-inner { max-width: 1080px; margin: 0 auto; }
.section-label {
  font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--brand-rose); margin-bottom: 10px;
}
.section-heading {

/* ── QUAL GRID ── */

.qual-card {

  padding: 28px 32px; box-shadow: var(--shadow-card);

}
.qual-card:hover { box-shadow: var(--shadow-deep); transform: translateY(-2px); }
.qual-card-label {
  font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;

.qual-card h3 { font-size: 16px; font-weight: 600; color: var(--gray-700); margin-bottom: 8px; }
.qual-card p { font-size: 14px; color: var(--gray-500); line-height: 1.7; }
.qual-card .note {

/* ── DEADLINE BANNER ── */
.deadline-banner {

.deadline-left { }
.deadline-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.6); margin-bottom: 6px; }
.deadline-date { font-size: 36px; font-weight: 700; color: #fff; letter-spacing: -1px; }
.deadline-sub { font-size: 14px; color: rgba(255,255,255,.65); margin-top: 4px; }
.deadline-cta {

/* ── APPLY INFO ── */
.apply-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ── TIMELINE ── */
.timeline-scroll { overflow-x: auto; padding-bottom: 8px; }
.timeline-track {

.timeline-track::before {

.t-step { display: flex; flex-direction: column; align-items: center; min-width: 110px; position: relative; }
.t-step-circle {

.t-step-date { font-size: 10px; font-weight: 600; color: var(--brand-rose); margin-bottom: 4px; text-align: center; }

  transition: box-shadow .2s, transform .2s;

.link-card:hover { box-shadow: var(--shadow-deep); transform: translateY(-2px); }

  width: 40px; height: 40px; border-radius: 10px;

.link-icon svg { width: 20px; height: 20px; }
.link-card-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--gray-300); margin-bottom: 4px; }

/* ── CTA FOOTER ── */
.cta-section {

.cta-section::before {

.cta-inner { max-width: 600px; margin: 0 auto; position: relative; }
.cta-heading { font-size: 38px; font-weight: 700; color: #fff; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 12px; }
.cta-sub { font-size: 16px; color: rgba(255,255,255,.5); margin-bottom: 36px; }
.cta-buttons { display: flex; gap: 12px; justify-content: center; }
.btn-primary {
  display: inline-block; padding: 14px 32px;
  background: var(--brand-red); color: #fff;
  font-size: 14px; font-weight: 600; border-radius: var(--r-micro);
  cursor: pointer; transition: background .15s; text-decoration: none;
}
.btn-primary:hover { background: var(--brand-rose); }
.btn-ghost {
  display: inline-block; padding: 14px 28px;
  background: rgba(255,255,255,.08); color: rgba(255,255,255,.75);
  font-size: 14px; font-weight: 500; border-radius: var(--r-micro);
  border: 1px solid rgba(255,255,255,.15); cursor: pointer; text-decoration: none;
  transition: background .15s;
}
.btn-ghost:hover { background: rgba(255,255,255,.14); }

/* ── FOOTER ── */
.footer {
  background: var(--warm-dark); border-top: 1px solid rgba(255,255,255,.06);
  padding: 32px 80px;
  display: flex; align-items: center; justify-content: space-between;
}
.footer-copy { font-size: 12px; color: rgba(255,255,255,.25); }
.footer-links { display: flex; gap: 20px; }
.footer-link { font-size: 12px; color: rgba(255,255,255,.3); text-decoration: none; cursor: pointer; }
.footer-link:hover { color: rgba(255,255,255,.6); }

/* ── SCROLL REVEAL ── */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity .55s ease, transform .55s ease; }
.reveal.visible { opacity: 1; transform: none; }
</style>
</head>
<body>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── data ── */
const steps = [
  { date: "8/29–9/22", name: "입사지원", active: false },

    note: "졸업예정자의 경우 입사 후 3개월 내 학위증명서를 제출하지 못할 시 입사가 취소될 수 있습니다."

  "지원서 내용 중 허위사실이 있을 경우 합격이 취소될 수 있습니다.",
  "전형 단계별 순서 및 일정은 내부사정에 의해 변경될 수 있으며, 전형결과는 LG Careers를 통해 확인하실 수 있습니다.",
  "자세한 내용은 각 시점에 맞추어 안내드릴 예정입니다.",
];

/* ── Reveal hook ── */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { el.classList.add('visible'); obs.disconnect(); }
    }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

/* ── Countdown ── */
function Countdown() {
  const [time, setTime] = useState({ d: 0, h: 0, m: 0, s: 0 });
  useEffect(() => {
    const target = new Date('2025-09-22T11:00:00+09:00');
    const tick = () => {
      const diff = target - Date.now();
      if (diff <= 0) { setTime({ d: 0, h: 0, m: 0, s: 0 }); return; }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      setTime({ d, h, m, s });
    };
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, []);
  return (
    <div style={{ display: 'flex', gap: 24, marginTop: 8 }}>
      {[['일', time.d], ['시간', time.h], ['분', time.m], ['초', time.s]].map(([u, v]) => (
        <div key={u} style={{ textAlign: 'center' }}>
          <div style={{ fontSize: 28, fontWeight: 700, color: '#fff', letterSpacing: -1, lineHeight: 1 }}>
            {String(v).padStart(2, '0')}
          </div>
          <div style={{ fontSize: 10, color: 'rgba(255,255,255,.4)', marginTop: 4, fontWeight: 600, letterSpacing: '.08em', textTransform: 'uppercase' }}>{u}</div>
        </div>
      ))}
    </div>
  );
}

/* ── Section components ── */
function RevealSection({ children, className }) {
  const ref = useReveal();
  return <div ref={ref} className={`reveal ${className || ''}`}>{children}</div>;
}

      {/* HERO */}

        <div className="hero-inner">
          <div className="hero-tag">
            <span className="hero-tag-dot"></span>
            2025 하반기 신입사원 채용
          </div>
          <h1>Join us,<br/><em>Make life</em><br/>better.</h1>
          <div className="hero-meta">
            <div className="hero-meta-item">
              <div className="hero-meta-label">모집기간</div>
              <div className="hero-meta-val">~ 9/22(월)</div>
              <div className="hero-meta-sub">오전 11시 마감</div>
            </div>
            <div className="hero-meta-item">
              <div className="hero-meta-label">지원처</div>
              <div className="hero-meta-val">LG Careers</div>
              <div className="hero-meta-sub">careers.lg.com</div>
            </div>
            <div className="hero-meta-item">
              <div className="hero-meta-label">입사 예정</div>
              <div className="hero-meta-val">2026년 1월</div>
              <div className="hero-meta-sub">정규직 즉시 근무</div>
            </div>
          </div>
        </div>
      </section>

      {/* DEADLINE BANNER */}
      <section className="section" id="apply">
        <div className="section-inner">
          <RevealSection>
            <div className="deadline-banner">
              <div className="deadline-left">
                <div className="deadline-eyebrow">지원 마감까지</div>

        </div>
      </section>

      {/* QUALIFICATIONS */}
      <section className="section section-alt" id="qualify">
        <div className="section-inner">
          <RevealSection>
            <div className="section-label">지원자격</div>
            <div className="section-heading">이런 분들을 기다립니다</div>
          </RevealSection>
          <RevealSection>
            <div className="qual-grid">
              {qualifications.map((q) => (
                <div className="qual-card" key={q.label}>
                  <div className="qual-card-label">{q.label}</div>
                  <h3>{q.title}</h3>
                  <p>{q.body}</p>
                  {q.note && <p className="note">{q.note}</p>}
                </div>
              ))}
            </div>
          </RevealSection>
        </div>
      </section>

      {/* PROCESS */}
      <section className="section" id="process">
        <div className="section-inner">
          <RevealSection>
            <div className="section-label">채용 프로세스</div>
            <div className="section-heading">전형 일정</div>
          </RevealSection>
          <RevealSection>
            <div className="timeline-scroll">
              <div className="timeline-track">
                {steps.map((s, i) => (
                  <div className={`t-step${s.active ? ' active' : ''}`} key={i}>
                    <div className="t-step-circle">{i + 1}</div>
                    <div className="t-step-date">{s.date}</div>
                    <div className="t-step-name" style={{ whiteSpace: 'pre-line' }}>{s.name}</div>
                  </div>
                ))}
              </div>
            </div>
            <div className="notes-list">
              {notes.map((n, i) => (
                <div className="note-item" key={i}>
                  <span className="note-bullet"></span>
                  <span>{n}</span>
                </div>
              ))}
            </div>
          </RevealSection>
        </div>
      </section>

      {/* LINKS */}
      <section className="section section-alt" id="links">
        <div className="section-inner">
          <RevealSection>
            <div className="section-label">채용정보 더보기</div>
            <div className="section-heading">공식 채널</div>
          </RevealSection>
          <RevealSection>
            <div className="links-row">
              <a className="link-card" href="https://www.youtube.com/@LGElectronicsKR" target="_blank" rel="noreferrer">
                <div className="link-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#C8102E" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                  </svg>
                </div>
                <div>
                  <div className="link-card-label">유튜브</div>
                  <div className="link-card-val">LG전자 채용</div>
                </div>
              </a>
              <a className="link-card" href="https://www.lge-recruit.com" target="_blank" rel="noreferrer">
                <div className="link-icon">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#C8102E" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                  </svg>
                </div>
                <div>
                  <div className="link-card-label">신입채용 페이지</div>
                  <div className="link-card-val">www.lge-recruit.com</div>
                </div>
              </a>
            </div>
          </RevealSection>
        </div>
      </section>

      {/* CTA */}
      <section className="cta-section">
        <div className="cta-inner">
          <div className="cta-heading">미래를 함께<br/>만들어갈 준비가 되셨나요?</div>
          <div className="cta-sub">LG전자와 함께 더 나은 삶을 만들어 나갑시다</div>
          <div className="cta-buttons">
            <a className="btn-primary" href="https://careers.lg.com" target="_blank" rel="noreferrer">지금 지원하기</a>
            <a className="btn-ghost" href="https://www.lge-recruit.com" target="_blank" rel="noreferrer">채용정보 더보기</a>
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer className="footer">
        <div className="footer-copy">© 2025 LG Electronics Inc. All rights reserved.</div>
        <div className="footer-links">
          <a className="footer-link" href="#">개인정보처리방침</a>
          <a className="footer-link" href="#">이용약관</a>
          <a className="footer-link" href="#">LG그룹 채용</a>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<div id="root"></div>
</body>
</html>
