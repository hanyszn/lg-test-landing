<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f6f5f4; }

/* ── Notion tokens ── */
:root {
  --black: rgba(0,0,0,0.95);
  --white: #ffffff;
  --warm-white: #f6f5f4;
  --warm-dark: #31302e;
  --gray-500: #615d59;
  --gray-300: #a39e98;
  --blue: #0075de;
  --lg-red: #C8102E;
  --border: 1px solid rgba(0,0,0,0.1);
  --shadow-card:
    rgba(0,0,0,0.04) 0px 4px 18px,
    rgba(0,0,0,0.027) 0px 2px 8px,
    rgba(0,0,0,0.02) 0px 1px 3px;
  --r-card: 12px;
  --r-micro: 4px;
}

/* ── Shared label ── */
.option-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--gray-300);
  margin-bottom: 8px;
}

/* ═══════════════════════════════
   OPTION A — Centered Hero + Cards
   ═══════════════════════════════ */
.optA {
  width: 860px;
  background: var(--white);
  border-radius: var(--r-card);
  overflow: hidden;
}
.optA-hero {
  background: var(--warm-dark);
  padding: 72px 64px 64px;
  text-align: center;
}
.optA-hero-eyebrow {
  font-size: 12px; font-weight: 500; letter-spacing:.1em; text-transform: uppercase;

}

}
.optA-hero-sub {

}
.optA-cta {

  background: var(--white); color: var(--warm-dark);

  border-radius: 4px; text-decoration: none; cursor: pointer;
}
.optA-body { padding: 48px 64px; }
.optA-deadline-bar {
  display: flex; align-items: center; gap: 16px;

.optA-deadline-label { font-size: 11px; font-weight: 600; letter-spacing:.08em; text-transform: uppercase; color: var(--gray-300); }
.optA-deadline-date { font-size: 18px; font-weight: 700; color: var(--black); }
.optA-cards { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 40px; }
.optA-card {
  background: var(--white); border: var(--border); border-radius: var(--r-card);
  padding: 24px; box-shadow: var(--shadow-card);
}
.optA-card-title { font-size: 11px; font-weight: 600; letter-spacing:.08em; text-transform: uppercase; color: var(--gray-300); margin-bottom: 10px; }
.optA-card-body { font-size: 14px; color: var(--black); line-height: 1.6; }
.optA-section-title { font-size: 13px; font-weight: 600; color: var(--gray-500); margin-bottom: 16px; }
.optA-timeline {
  display: flex; gap: 0; overflow-x: auto;
  background: var(--warm-white); border-radius: 8px; padding: 24px 20px;
  border: var(--border);
}
.optA-step { display: flex; flex-direction: column; align-items: center; min-width: 80px; position: relative; }
.optA-step:not(:last-child)::after {
  content:''; position: absolute; top: 14px; left: 50%; width: 100%; height: 1px;
  background: rgba(0,0,0,0.15);
}
.optA-step-dot {
  width: 28px; height: 28px; border-radius: 50%; background: var(--white);
  border: var(--border); display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: var(--black); z-index: 1; margin-bottom: 8px;
  box-shadow: var(--shadow-card);
}
.optA-step-date { font-size: 9px; font-weight: 600; color: var(--blue); margin-bottom: 2px; }
.optA-step-name { font-size: 10px; color: var(--gray-500); text-align: center; line-height: 1.3; }

/* ═══════════════════════════════

.optB-sidebar-block-val { font-size: 15px; font-weight: 600; color: var(--white); line-height:1.5; }
.optB-sidebar-block-sub { font-size: 12px; color: rgba(255,255,255,.5); margin-top:2px; }
.optB-main { padding: 40px 40px; display: flex; flex-direction: column; gap: 32px; overflow-y: auto; }
.optB-section-heading { font-size: 11px; font-weight: 600; letter-spacing:.1em; text-transform: uppercase; color: var(--gray-300); margin-bottom: 12px; }
.optB-info-row { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 12px; }
.optB-info-key { font-size: 12px; font-weight: 600; color: var(--gray-500); min-width: 48px; }
.optB-info-val { font-size: 13px; color: var(--black); line-height: 1.6; }
.optB-info-val .sub { font-size: 11px; color: var(--gray-300); margin-top: 2px; display: block; }
.optB-divider { height: 1px; background: rgba(0,0,0,0.06); }
.optB-steps { display: flex; flex-direction: column; gap: 10px; }
.optB-step-row { display: flex; gap: 12px; align-items: flex-start; }
.optB-step-num { width: 22px; height: 22px; border-radius: 50%; border: var(--border); display:flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; color: var(--gray-500); flex-shrink: 0; margin-top:1px; }
.optB-step-info { }
.optB-step-date { font-size: 11px; font-weight: 600; color: var(--blue); }
.optB-step-label { font-size: 13px; color: var(--black); }

.optB-btn-primary { background: var(--black); color: var(--white); }
.optB-btn-secondary { background: rgba(0,0,0,0.05); color: var(--black); }

.optC-tstep { display: flex; flex-direction: column; align-items: center; min-width: 90px; position: relative; }
.optC-tstep:not(:last-child)::after {

.optC-tstep-date { font-size: 10px; font-weight: 600; color: var(--blue); margin-bottom: 3px; }
.optC-tstep-name { font-size: 11px; color: var(--gray-500); text-align: center; line-height: 1.4; }
.optC-notes { margin-top: 28px; display: flex; flex-direction: column; gap: 8px; }
.optC-note-item { font-size: 13px; color: var(--gray-500); line-height: 1.65; padding-left: 16px; position:relative; }

.optC-link-card { background: var(--white); border: var(--border); border-radius: var(--r-card); padding: 16px 20px; flex: 1; box-shadow: var(--shadow-card); }

.optC-cta-sub { font-size: 15px; color: var(--gray-500); margin-bottom: 28px; }
.optC-btn { display: inline-block; padding: 14px 32px; border-radius: 4px; font-size: 14px; font-weight: 600; background: var(--black); color: var(--white); cursor: pointer; margin: 0 6px; }
.optC-btn-ghost { background: transparent; color: var(--black); border: var(--border); }
</style>

        <div className="optC-qual-grid">
          {[
            { title: "대상", body: "2026년 2월 졸업예정자 또는 기졸업자", note: "2026년 1월부터 정규직으로 즉시 근무 가능해야 합니다." },
            { title: "학위", body: "국내/해외 학사, 석사, 박사 또는 이와 동등한 효력이 인정되는 자격 취득(예정)자", note: "졸업예정자의 경우 입사 후 3개월 내 학위증명서 제출 필요." },
            { title: "병역", body: "군필자 또는 면제자에 한함", note: null },
            { title: "지원서 접수", body: "채용 홈페이지를 통한 온라인 입사지원", note: "LG Careers — careers.lg.com" },
          ].map((c) => (
            <div className="optC-qual-card" key={c.title}>
              <h3>{c.title}</h3>
              <p>{c.body}</p>
              {c.note && <p className="note">{c.note}</p>}
            </div>
          ))}
        </div>
      </div>

      {/* 채용 프로세스 */}
      <div className="optC-section optC-section-alt">
        <div className="optC-section-heading">채용 프로세스</div>
        <div className="optC-timeline-wrapper">
          {steps.map((s, i) => (
            <div className="optC-tstep" key={i}>
              <div className="optC-tstep-circle">{i + 1}</div>
              <div className="optC-tstep-date">{s.date}</div>
              <div className="optC-tstep-name">{s.name}</div>
            </div>
          ))}
        </div>
        <div className="optC-notes">
          {notes.map((n, i) => <div className="optC-note-item" key={i}>{n}</div>)}
        </div>
      </div>

      {/* 채용정보 링크 */}
      <div className="optC-section">
        <div className="optC-section-heading">채용정보 더보기</div>
        <div className="optC-links-row">
          <div className="optC-link-card">
            <div className="lk-label">유튜브</div>
            <div className="lk-val">LG전자 채용</div>
          </div>
          <div className="optC-link-card">
            <div className="lk-label">신입채용 페이지</div>
            <div className="lk-val">www.lge-recruit.com</div>
          </div>
        </div>
      </div>

      {/* CTA */}
      <div className="optC-cta-section">
        <div className="optC-cta-heading">미래를 함께 만들어갈 준비가 되셨나요?</div>
        <div className="optC-cta-sub">LG전자와 함께 더 나은 삶을 만들어 나갑시다</div>
        <span className="optC-btn">지원하기</span>
        <span className="optC-btn optC-btn-ghost">채용 정보 더보기</span>
      </div>
    </div>
  );
}

/* ── Canvas ── */
function App() {
  return (
    <DesignCanvas title="LG전자 채용 — 레이아웃 옵션">
      <DCSection id="layouts" title="레이아웃 방향 탐색">

        <DCArtboard id="optA" label="Option A — 중앙 집중 + 카드" width={860} height={700}>
          <OptionA />
        </DCArtboard>

        <DCArtboard id="optB" label="Option B — 사이드바 분할" width={860} height={700}>
          <OptionB />
        </DCArtboard>

        <DCArtboard id="optC" label="Option C — 섹션 스크롤" width={860} height={900}>
          <OptionC />
        </DCArtboard>

      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<div id="root"></div>
</body>
</html>
